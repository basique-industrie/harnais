# One-time encrypted transfer of the five Apple signing secrets.
# Only GitHub's public destination keys appear here. No admin token is sent to CI.
name: Transfer Apple secrets to organizations
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: apple-organization-secret-transfer
  cancel-in-progress: false
jobs:
  encrypt:
    if: github.repository == 'basique-industrie/harnais' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 10
    steps:
      - name: Install encryption dependencies before exposing secrets
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/apple-transfer-venv"
          "$RUNNER_TEMP/apple-transfer-venv/bin/pip" install --disable-pip-version-check PyNaCl==1.6.2 cffi==2.1.1 pycparser==3.12
      - name: Encrypt only for cleyrop and basique-industrie
        shell: bash
        env:
          APPLE_DEVELOPER_ID_APPLICATION_P12: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12 }}
          APPLE_DEVELOPER_ID_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_PASSWORD }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_KEY_ISSUER: ${{ secrets.APPLE_NOTARY_KEY_ISSUER }}
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
        run: |
          set -euo pipefail
          umask 077
          "$RUNNER_TEMP/apple-transfer-venv/bin/python" - <<'PYTHON'
          import base64
          import json
          import os
          from pathlib import Path

          from nacl.public import PublicKey, SealedBox

          NAMES = (
              "APPLE_DEVELOPER_ID_APPLICATION_P12",
              "APPLE_DEVELOPER_ID_PASSWORD",
              "APPLE_NOTARY_KEY_ID",
              "APPLE_NOTARY_KEY_ISSUER",
              "APPLE_NOTARY_KEY_P8",
          )
          DESTINATIONS = {
              "cleyrop": {"key_id": "3380204578043523366", "key": "y0JZTajk/M99Ot+OgajIdn0H8gbLxXBRPnhR4iBTsgU="},
              "basique-industrie": {"key_id": "3380204578043523366", "key": "xKCNhl4Snu9PNOUsKwOoM6/SfknIgYHHb2186iqPo3g="},
          }


          def encrypt(destinations, values):
              if set(destinations) != {"cleyrop", "basique-industrie"}:
                  raise ValueError("Unexpected destination")
              if set(values) != set(NAMES) or not all(values.values()):
                  raise ValueError("A required Apple secret is missing")
              result = []
              for org, key in destinations.items():
                  box = SealedBox(PublicKey(base64.b64decode(key["key"], validate=True)))
                  for name in NAMES:
                      encrypted = box.encrypt(values[name].encode("utf-8"))
                      result.append({
                          "org": org, "name": name, "key_id": key["key_id"],
                          "encrypted_value": base64.b64encode(encrypted).decode("ascii"),
                      })
              return result


          if __name__ == "__main__":
              os.umask(0o077)
              if os.environ.get("GITHUB_REPOSITORY") != "basique-industrie/harnais" or os.environ.get("GITHUB_REF") != "refs/heads/main":
                  raise SystemExit("Unexpected source repository or ref")
              try:
                  entries = encrypt(DESTINATIONS, {name: os.environ.get(name, "") for name in NAMES})
                  output = Path(os.environ["RUNNER_TEMP"]) / "apple-org-transfer.json"
                  output.write_text(json.dumps({"source": "basique-industrie/harnais:release", "run_id": os.environ["GITHUB_RUN_ID"], "entries": entries}))
              except Exception:
                  # Never include exception values or local variables in logs.
                  raise SystemExit("Encrypted transfer preparation failed; no secret values were logged") from None
              print("Prepared 10 encrypted entries for the two fixed destination organizations.")
          PYTHON
      - name: Preserve sealed transfer payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apple-organization-secrets-encrypted
          path: ${{ runner.temp }}/apple-org-transfer.json
          if-no-files-found: error
          retention-days: 1
      - name: Remove sealed temporary file
        if: always()
        shell: bash
        run: python3 -c 'import os; from pathlib import Path; (Path(os.environ["RUNNER_TEMP"]) / "apple-org-transfer.json").unlink(missing_ok=True)'
