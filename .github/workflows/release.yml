# All credentials belong to Harnais's protected `release` environment.
# No personal token or cross-repository workflow dispatch is needed.
name: Release
run-name: Release ${{ inputs.tag || github.ref_name }}${{ inputs.dry_run && ' (validation only)' || '' }}

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build (never move a published tag)
        required: true
        type: string
      dry_run:
        description: Build, sign and notarize without changing the GitHub release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'basique-industrie/harnais'
    runs-on: macos-26
    environment: release
    permissions:
      contents: write
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: source
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_REPO: basique-industrie/harnais
    steps:
      # Keep release tooling from this workflow revision when retrying an older
      # tag. The source checkout stays clean for scripts/release.sh.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: release-tools
          persist-credentials: false

      - name: Validate tag input
        working-directory: release-tools
        run: python3 scripts/publish-release.py validate-tag "$TAG"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Check version, changelog and GitHub access
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DRY_RUN: ${{ inputs.dry_run || false }}
        run: python3 ../release-tools/scripts/publish-release.py preflight "$TAG"

      - uses: actions/setup-go@v5
        if: ${{ steps.preflight.outputs.published != 'true' || inputs.dry_run }}
        with:
          go-version-file: source/Helpers/WhatsAppBridge/go.mod
          cache-dependency-path: source/Helpers/WhatsAppBridge/go.sum

      - name: Prepare signing credentials
        if: ${{ steps.preflight.outputs.published != 'true' || inputs.dry_run }}
        env:
          APPLE_DEVELOPER_ID_APPLICATION_P12: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12 }}
          APPLE_DEVELOPER_ID_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_PASSWORD }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_KEY_ISSUER: ${{ secrets.APPLE_NOTARY_KEY_ISSUER }}
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          HARNAIS_NATIVE_OAUTH_CATALOG: ${{ secrets.HARNAIS_NATIVE_OAUTH_CATALOG }}
        run: python3 ../release-tools/scripts/release-keychain.py prepare

      - name: Build, test, sign and notarize the tagged source
        if: ${{ steps.preflight.outputs.published != 'true' || inputs.dry_run }}
        env:
          NOTARY_PROFILE: harnais-release
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          xcodebuild -version
          swift --version
          ./scripts/release.sh

      - name: Generate and verify the signed update feed
        if: ${{ steps.preflight.outputs.published != 'true' || inputs.dry_run }}
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: python3 ../release-tools/scripts/generate-appcast.py "$TAG"

      - name: Remove signing credentials
        if: always()
        run: python3 ../release-tools/scripts/release-keychain.py cleanup

      - name: Preserve notarized artifacts
        if: ${{ steps.preflight.outputs.published != 'true' || inputs.dry_run }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Harnais-notarized-${{ inputs.tag || github.ref_name }}
          path: |
            source/dist/Harnais-*.zip
            source/dist/Harnais-*.zip.sha256
            source/dist/appcast.xml
          if-no-files-found: error
          retention-days: 14

      - name: Verify and publish
        if: ${{ !inputs.dry_run && steps.preflight.outputs.published != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ../release-tools/scripts/publish-release.py publish "$TAG"

      - name: Record validation run
        if: ${{ inputs.dry_run }}
        run: |
          python3 ../release-tools/scripts/publish-release.py verify "$TAG"
          echo "Signed and notarized $TAG. Artifacts are attached to this run; no release was changed." >> "$GITHUB_STEP_SUMMARY"
